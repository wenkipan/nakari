# Nakari - DAN Memory System
# Docker Compose 配置
# 一键启动: docker compose up -d

services:
  # Neo4j 图数据库 (支持向量搜索)
  neo4j:
    image: neo4j:5.23.0  # 5.23+ 支持 4096 维向量
    container_name: nakari-neo4j
    ports:
      - "7474:7474"  # HTTP (Neo4j Browser)
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password123  # 用户名/密码
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      # 性能优化
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_dbms_memory_pagecache_size=512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis (Celery Broker & Cache)
  redis:
    image: redis:7-alpine
    container_name: nakari-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Nakari 应用
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nakari-app
    ports:
      - "8000:8000"  # API 端口 (如果有)
    env_file:
      - .env
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=password123
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - .:/app
      - pip_cache:/root/.cache/pip
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    stdin_open: true
    tty: true
    restart: unless-stopped

  # Celery Worker
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nakari-celery-worker
    command: celery -A tasks worker --loglevel=info
    env_file:
      - .env
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=password123
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - .:/app
    depends_on:
      - app
      - redis
    restart: unless-stopped

volumes:
  neo4j_data:
    name: nakari_neo4j_data
  neo4j_logs:
    name: nakari_neo4j_logs
  redis_data:
    name: nakari_redis_data
  pip_cache:
    name: nakari_pip_cache

# 网络配置
networks:
  default:
    name: nakari_network
